<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#27272a" stroke-width="6"/>
  
  <!-- Outer Glow Arc / Gauge element representing Time & Efficiency -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#27272a" stroke-width="20" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#accent)" stroke-width="20" stroke-dasharray="820" stroke-dashoffset="260" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Clock & Wrench Combined Symbol -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Central Mechanical Gear & Wrench Symbol -->
    <path d="M-60 -90 L-40 -110 C-30 -120 -10 -120 0 -110 L15 -95 C25 -85 25 -65 15 -55 L-30 -10 L10 30 C30 50 30 80 10 100 C-10 120 -40 120 -60 100 L-100 60 C-120 40 -120 10 -100 -10 L-60 -50 Z" 
          fill="none" stroke="url(#accent)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" filter="url(#shadow)"/>
    
    <!-- Stopwatch center notch / clock hands -->
    <circle cx="40" cy="-30" r="38" fill="#18181b" stroke="#fbbf24" stroke-width="12"/>
    <path d="M40 -30 L40 -50 M40 -30 L55 -30" stroke="#fef08a" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
